<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Seeky</title>
  <style>
    /* Themes are variable sets on <html data-theme="…">; every rule below reads only these.
       --glow is the colour the CRT/neon text-shadows are mixed from — 'transparent' turns every
       glow off. --crt is the scanline overlay's display value (block | none). --mhl-* style the
       match highlight: glowing themes burn the glyphs, flat themes use a background chip. */

    /* phosphor (default) — Phosphor CRT palette. Body text is a softened mint rather than pure
       #00FF41 — a full screen of saturated phosphor at 13px is unreadable for the dense code this
       pane shows; the pure green is spent on accents only. Amber is kept for modified files:
       green+amber is what dual-phosphor terminals actually did, so it reads as period-correct. */
    :root {
      color-scheme: dark;
      --bg: #050806;          /* near-black, green-cast (film blacks are never neutral) */
      --bg-alt: #0b110c;      /* chrome bars */
      --bg-sel: rgba(0, 255, 65, .10);
      --border: #17321f;
      --fg: #9fefb3;          /* body */
      --fg-dim: #5e9b70;      /* metadata */
      --accent: #00ff41;      /* live phosphor */
      --hot: #eafff0;         /* the leading glyph — see .mhl */
      --amber: #ffb000;       /* modified / deleted */
      --green: #00ff41;       /* untracked / added */
      --hl: rgba(0, 255, 65, .13);
      --glow: #00ff41;
      --crt: block;
      --mhl-fg: var(--hot);
      --mhl-bg: transparent;
    }
    /* dark — neutral black/white, no effects */
    :root[data-theme="dark"] {
      --bg: #0d0d0d;
      --bg-alt: #161616;
      --bg-sel: rgba(255, 255, 255, .09);
      --border: #2a2a2a;
      --fg: #d4d4d4;
      --fg-dim: #808080;
      --accent: #ffffff;
      --hot: #ffffff;
      --amber: #d7a64a;
      --green: #7fbf7f;
      --hl: rgba(255, 255, 255, .07);
      --glow: transparent;
      --crt: none;
      --mhl-fg: #ffffff;
      --mhl-bg: rgba(255, 255, 255, .16);
    }
    /* light — white/black, highlighter-yellow matches */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-alt: #f3f3f3;
      --bg-sel: rgba(0, 0, 0, .07);
      --border: #dcdcdc;
      --fg: #1f1f1f;
      --fg-dim: #6e6e6e;
      --accent: #000000;
      --hot: #000000;
      --amber: #9a6700;
      --green: #1a7f37;
      --hl: rgba(0, 0, 0, .06);
      --glow: transparent;
      --crt: none;
      --mhl-fg: #000000;
      --mhl-bg: #fff176;
    }
    /* tokyo-night — folke/tokyonight.nvim "night" */
    :root[data-theme="tokyo-night"] {
      --bg: #1a1b26;
      --bg-alt: #16161e;
      --bg-sel: #283457;
      --border: #292e42;
      --fg: #c0caf5;
      --fg-dim: #565f89;
      --accent: #7aa2f7;
      --hot: #c0caf5;
      --amber: #e0af68;
      --green: #9ece6a;
      --hl: #292e42;
      --glow: transparent;
      --crt: none;
      --mhl-fg: #ff9e64;
      --mhl-bg: transparent;
    }
    /* cyberpunk — neon magenta/cyan/yellow on violet-black, glow kept, scanlines faint */
    :root[data-theme="cyberpunk"] {
      --bg: #0b0014;
      --bg-alt: #13001f;
      --bg-sel: rgba(255, 42, 109, .14);
      --border: #3a1655;
      --fg: #d6ccff;
      --fg-dim: #7d6aa8;
      --accent: #ff2a6d;
      --hot: #00f0ff;
      --amber: #fcee0a;
      --green: #05ffa1;
      --hl: rgba(0, 240, 255, .10);
      --glow: #00f0ff;
      --crt: block;
      --mhl-fg: #00f0ff;
      --mhl-bg: transparent;
    }
    /* catppuccin-{latte,frappe,macchiato,mocha} — catppuccin/palette. base/mantle/surface0 for
       the surfaces, text + overlay1, mauve accent, peach matches, yellow/green git states. */
    :root[data-theme="catppuccin-latte"] {
      color-scheme: light;
      --bg: #eff1f5;
      --bg-alt: #e6e9ef;
      --bg-sel: #ccd0da;
      --border: #ccd0da;
      --fg: #4c4f69;
      --fg-dim: #8c8fa1;
      --accent: #8839ef;
      --hot: #4c4f69;
      --amber: #df8e1d;
      --green: #40a02b;
      --hl: #ccd0da;
      --glow: transparent;
      --crt: none;
      --mhl-fg: #fe640b;
      --mhl-bg: transparent;
    }
    :root[data-theme="catppuccin-frappe"] {
      --bg: #303446;
      --bg-alt: #292c3c;
      --bg-sel: #414559;
      --border: #414559;
      --fg: #c6d0f5;
      --fg-dim: #838ba7;
      --accent: #ca9ee6;
      --hot: #c6d0f5;
      --amber: #e5c890;
      --green: #a6d189;
      --hl: #414559;
      --glow: transparent;
      --crt: none;
      --mhl-fg: #ef9f76;
      --mhl-bg: transparent;
    }
    :root[data-theme="catppuccin-macchiato"] {
      --bg: #24273a;
      --bg-alt: #1e2030;
      --bg-sel: #363a4f;
      --border: #363a4f;
      --fg: #cad3f5;
      --fg-dim: #8087a2;
      --accent: #c6a0f6;
      --hot: #cad3f5;
      --amber: #eed49f;
      --green: #a6da95;
      --hl: #363a4f;
      --glow: transparent;
      --crt: none;
      --mhl-fg: #f5a97f;
      --mhl-bg: transparent;
    }
    :root[data-theme="catppuccin-mocha"] {
      --bg: #1e1e2e;
      --bg-alt: #181825;
      --bg-sel: #313244;
      --border: #313244;
      --fg: #cdd6f4;
      --fg-dim: #7f849c;
      --accent: #cba6f7;
      --hot: #cdd6f4;
      --amber: #f9e2af;
      --green: #a6e3a1;
      --hl: #313244;
      --glow: transparent;
      --crt: none;
      --mhl-fg: #fab387;
      --mhl-bg: transparent;
    }
    /* nvim (VSNeo) — the colorscheme's own float colors. VSNeo's companion pushes them and
       applyPalette sets them inline on <html>; only the flat-look switches live here. */
    :root[data-theme="nvim"] {
      --glow: transparent;
      --crt: none;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 13px;
      overflow: hidden;
    }
    /* CRT glass: scanlines + edge vignette. Fixed and pointer-events:none, so it never
       participates in layout (out-of-flow, hence not a flex item) or swallows clicks.
       3px period at .10 alpha reads as texture at this size instead of banding the text. */
    body::after {
      content: '';
      display: var(--crt);
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .10) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55) 100%);
    }
    /* Prompt row — Telescope bottom style: mode label + "> " + query, at the window's
       bottom edge with the best result directly above it */
    #prompt {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
    }
    /* Uppercase + tracked only on the chrome label — never on code text, where it would
       break the column alignment the preview depends on. */
    #mode-label {
      color: var(--accent);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: .14em;
      text-shadow: 0 0 8px color-mix(in srgb, var(--glow) 45%, transparent);
    }
    #prompt .chevron { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--glow) 50%, transparent); }
    /* Prompt normal mode (VSNeo, opt-in): the prompt stops taking text, j/k move the rows. */
    #prompt.normal .chevron { color: var(--amber); }
    #prompt.normal #query { caret-color: transparent; }
    #query {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--hot);
      font: inherit;
      caret-color: var(--accent);
    }
    /* Results (left) + preview (right), roughly 50/50 */
    #main { flex: 1; display: flex; min-height: 0; }
    #results {
      flex: 1;
      min-width: 0;
      position: relative;
      border-right: 1px solid var(--border);
    }
    /* Bottom-anchored scroller: pinned to the prompt, grows upward to max-height.
       Plain block flow — flex tricks (column-reverse, auto margins) render glitchy
       in Chromium inside scrollers (twice confirmed). */
    #results-inner {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 100%;
      overflow-y: auto;
    }
    #results .row {
      padding: 3px 10px;
      /* Left pad reserves the selected row's beam edge so rows never shift on selection. */
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    /* Beam persistence: the scanning beam resting on one line. */
    #results .row.selected {
      background: var(--bg-sel);
      border-left-color: var(--accent);
      color: var(--hot);
    }
    #results .dim { color: var(--fg-dim); }
    /* Grep grouping: file header row above its matches */
    #results .group-header {
      padding: 4px 10px 1px;
      color: var(--accent);
      font-weight: bold;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    #results .row.match { padding-left: 22px; }
    #preview-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #preview-title {
      padding: 4px 10px;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #preview-content {
      flex: 1;
      margin: 0;
      padding: 6px 10px;
      overflow: auto;
      font: inherit;
      line-height: 1.45;
    }
    #preview-content .line { display: block; white-space: pre; }
    #preview-content .line.hl { background: var(--hl); }
    /* Ctrl+/ help (VSNeo): every key and picker, over the results and preview. */
    #main { position: relative; }
    #help {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: auto;
      padding: 10px 16px;
      background: var(--bg);
      columns: 2 30em;
      column-gap: 32px;
    }
    #help.open { display: block; }
    #help h3 {
      margin: 10px 0 4px;
      color: var(--accent);
      font-size: 1em;
      letter-spacing: .08em;
      text-transform: uppercase;
      break-after: avoid;
    }
    #help .key-row { display: flex; gap: 12px; padding: 1px 0; }
    #help section { break-inside: avoid; }
    #help .keys { flex: 0 0 16em; color: var(--hot); white-space: nowrap; }
    #help .what { color: var(--fg); }
    #help .note { color: var(--fg-dim); margin: 8px 0; break-inside: avoid; }
    /* THE SIGNATURE — span-level match highlight (grep ranges from fff-c; symbol name ranges
       from FuzzyMatcher). In the film's rain each column's leading glyph burns near-white and
       the tail decays into dark green. The matched characters are this UI's leading glyphs:
       the live ones, scattered through a dimmer string. So they burn instead of sitting in an
       inverted chip — same information, and it is the one place the theme is loud. */
    .mhl {
      color: var(--mhl-fg);
      background: var(--mhl-bg);
      border-radius: 2px;
      font-weight: 700;
      text-shadow:
        0 0 4px color-mix(in srgb, var(--glow) 95%, transparent),
        0 0 10px color-mix(in srgb, var(--glow) 55%, transparent),
        0 0 20px color-mix(in srgb, var(--glow) 28%, transparent);
    }
    /* Git status badge: amber M = modified, green ?? = untracked/added, dim = other */
    .git-badge {
      display: inline-block;
      min-width: 2ch;
      margin-right: 6px;
      padding: 0 3px;
      border-radius: 3px;
      font-size: 11px;
      text-align: center;
    }
    .git-badge.m { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); }
    .git-badge.ut { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
    .git-badge.dim { color: var(--fg-dim); background: color-mix(in srgb, var(--fg-dim) 12%, transparent); }
    /* Definition badge (grep rows whose match SymbolClassifier flagged as a declaration) */
    .def-badge {
      margin-right: 6px;
      padding: 0 3px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font-size: 10px;
      color: var(--accent);
    }
    /* Symbol kind badge (class / method / property / field …) — fixed width so names align.
       Brackets come from CSS, not the message payload, so the host keeps sending a bare kind. */
    .kind-badge {
      display: inline-block;
      min-width: 11ch;
      margin-right: 8px;
      font-size: 10px;
      color: var(--fg-dim);
      text-transform: lowercase;
    }
    .kind-badge:not(:empty)::before { content: '['; }
    .kind-badge:not(:empty)::after { content: ']'; }
    /* Trailing "path:line" on symbol rows */
    .sym-location {
      margin-left: 8px;
      color: var(--fg-dim);
      font-size: 11px;
    }
    /* Status line at the bottom — result count / indexing / errors */
    #status {
      padding: 4px 10px;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
      color: var(--fg-dim);
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Readout marker: this line is the machine talking, not content. */
    #status::before { content: '▸ '; color: var(--accent); }
  </style>
</head>
<body>
  <!--
    SeekyVS spike UI — Telescope-style layout with the prompt at the bottom (results left,
    preview right, status line above the prompt; best match adjacent to the prompt).
    Plain JS, no build step, no dependencies.

    The production version is intended to reuse the Seeky VS Code extension's webview client
    (media/main.js) behind a thin shim that maps VS Code's `acquireVsCodeApi()` onto the WebView2
    bridge, e.g.:

      function acquireVsCodeApi() {
        return {
          postMessage: (m) => window.chrome.webview.postMessage(m),
          // host messages arrive via window.chrome.webview.addEventListener('message', ...)
          setState: (s) => { /* map or drop */ },
          getState: () => null,
        };
      }

    Message contract:
      page -> host: { type: 'search', query, mode, grepMode }   mode: 'files' | 'grep' | 'buffer' | 'git'
                                                                      | 'mixed' | 'symbols';
                                                                mixed = Files & Folders (fff
                                                                search_mixed), folder rows carry
                                                                isDirectory;
                                                                buffer = Current File: grepMode
                                                                matching over the active editor's
                                                                lines, rows shaped like grep's;
                                                                grepMode: 'plain' | 'regex' | 'fuzzy'
                                                                  | 'any' ('|'-separated literals,
                                                                  fff multi_grep; constraint tokens
                                                                  like *.cs split off by the host)
                                                                symbols and files also search on
                                                                an empty query (the workspace's
                                                                symbols / recent files)
                    { type: 'preview', path, line?, binary?, directory? }
                    { type: 'open', path, line?, col?, directory?, split? }
                                                                directory=true opens the folder
                                                                in Windows Explorer; col is 1-based;
                                                                split (VSNeo): 'vertical' (Ctrl+V)
                                                                or 'horizontal' (Ctrl+X)
                    { type: 'pick', mode, name }                VSNeo list modes whose Enter is an
                                                                nvim action (a mark jump, a register
                                                                paste, a mapping, a history entry)
                    { type: 'quickfix', title, items }          VSNeo, Ctrl+Q: the visible rows,
                                                                best first, as [{ path, line, text }]
                                                                for nvim's quickfix list
                    { type: 'close' }
                    { type: 'resizeWindow', step }              +1 grow / -1 shrink / 0 default;
                                                                the host owns the HWND and the
                                                                screen metrics, so it does the math
                    { type: 'stateChanged', fontSize, grepMode, defsOnly, theme }
                                                                sent whenever the user changes one
                                                                of them; the host holds it in
                                                                memory and writes it on close
      host -> page: { type: 'results', items, done, capped, duration }
                    items: [{ name, path, line?, col?, text?, frecency?, ranges?, kind?,
                              nameRanges?, gitStatus?, isBinary?, isDefinition?, isDirectory? }]
                    (files/git/mixed: name=path; files and mixed file rows +line/col when the
                    query ended in ':line[:col]' (fff parses it; same location on every row);
                    mixed: +isDirectory on folder rows; grep: +line/col/text and
                    ranges = [start,end) char indices into text for .mhl span highlighting,
                    grep only, may be [];
                    symbols: name=symbol name, +kind/line/text and nameRanges = [start,end)
                    char indices into NAME — symbol rows highlight the name, not the line)
                    VSNeo list modes (buffers, oldfiles, marks, registers, diagnostics, keymaps,
                    command_history, search_history; host-entered, list on an empty query):
                    items [{ name, kind, detail, nameRanges, path?, line?, col?, preview?,
                    pick? }] - pick rows send 'pick', the rest 'open'; preview is shown as is
                    { type: 'preview', path, content, line? }   dirs: content = entry listing
                    { type: 'preview', path, binary: true }     binary files: no content
                    { type: 'status', message }
                    { type: 'reset' }                      clean slate each time the popup is shown
                    { type: 'setMode', mode }              sent with 'reset' when a command
                                                           shows the popup. Resume Last Search
                                                           sends neither: the page is re-shown
                                                           exactly as it was left
                    { type: 'setQuery', query }            pre-fills the prompt and searches;
                                                           sent by Grep Word Under Cursor with the
                                                           editor's selection or the identifier
                                                           under the caret. Arrives after
                                                           'setMode' — the search carries the mode
                    { type: 'history', queries }           past queries (fff track_query
                                                           history), most recent first;
                                                           ↑ in an empty prompt cycles them
                    { type: 'setState', fontFamily, fontSize, grepMode, defsOnly, theme,
                              palette?, promptNormal? }
                                                           palette and promptNormal are VSNeo's:
                                                           the colorscheme's colors for the 'nvim'
                                                           theme ({ 'bg': '#rrggbb', … }, CSS
                                                           variable names without the dashes),
                                                           and vim.g.vsneo_seeky_prompt_normal
                                                           restored popup state. fontFamily is
                                                           read-only (hand-edited in
                                                           %LOCALAPPDATA%\SeekyVS\settings.json);
                                                           the rest round-trips via 'stateChanged'
                                                           and is saved per solution in
                                                           <workspace>\.vs\seeky\state.json.
                                                           Ctrl+Plus/Minus adjust the live size
                                                           (the host disables Chromium's own zoom
                                                           accelerators); Ctrl+0 resets. theme
                                                           (Ctrl+T cycles) is global — the host
                                                           keeps it in settings.json, not per
                                                           solution

    SECURITY: all file content and query text is untrusted workspace data — it only ever enters
    the DOM via textContent (never innerHTML).
  -->
  <div id="main">
    <div id="results"><div id="results-inner"></div></div>
    <div id="preview-pane">
      <div id="preview-title"></div>
      <pre id="preview-content"></pre>
    </div>
    <div id="help" role="dialog" aria-label="Seeky keys and pickers"></div>
  </div>
  <div id="status">starting…</div>
  <div id="prompt">
    <span id="mode-label">Find Files</span>
    <span class="chevron">&gt;</span>
    <input id="query" type="text" autocomplete="off" spellcheck="false" autofocus />
  </div>

  <script>
    (function () {
      'use strict';

      var bridge = window.chrome && window.chrome.webview;
      var queryEl = document.getElementById('query');
      var modeLabelEl = document.getElementById('mode-label');
      var resultsEl = document.getElementById('results-inner');
      var previewTitleEl = document.getElementById('preview-title');
      var previewContentEl = document.getElementById('preview-content');
      var statusEl = document.getElementById('status');

      var HINT = 'Ctrl+/ all keys and pickers · Tab next mode · Enter open · Ctrl+V/X split · Ctrl+Q quickfix · Esc close';

      // ---------------------------------------------------------------- help (VSNeo)
      // Ctrl+/ (Telescope's insert-mode help key), or ? in prompt normal mode. Keep in step with
      // onPromptKeyDown and the pickers VSNeo serves; built with textContent like everything else.
      var HELP = [
        ['Move and open', [
          ['↑ ↓  Ctrl+N/P  Ctrl+J/K', 'move through the results'],
          ['Enter', 'open the selected result'],
          ['Ctrl+V', 'open it in a new vertical tab group (:vsp)'],
          ['Ctrl+X', 'open it in a split (:sp)'],
          ['Ctrl+Q', 'send the results to the quickfix list and jump to the first; then :cnext / :cprev (or ]q / [q)'],
          ['↑ on an empty prompt', 'past queries'],
          ['Esc', 'close (with vim.g.vsneo_seeky_prompt_normal: normal mode first, then close)'],
        ]],
        ['Modes and filters', [
          ['Tab  Ctrl+G', 'next mode: Files, Grep, Current File, Symbols, Git, Files & Folders'],
          ['Ctrl+R', 'grep sub-mode: plain, regex, fuzzy, any'],
          ['Ctrl+D', 'grep: definitions only'],
          ['Ctrl+F', 'grep inside the selected file or folder'],
        ]],
        ['In the query', [
          ['Foo.cs:42:9', 'Files: open at line 42, column 9'],
          ['*.cs needle', 'Grep: only in .cs files (folder/ works too)'],
          ['a|b', 'Grep in any mode: either literal'],
          ['(empty)', 'Files: your recent files'],
        ]],
        ['Look', [
          ['Ctrl+T', 'next colour theme (nvim = your colorscheme)'],
          ['Ctrl+±  Ctrl+0', 'font size / reset'],
          ['Ctrl+Shift+±  Ctrl+Shift+0', 'window size / reset'],
          ['Ctrl+/', 'this help (Esc or Ctrl+/ closes it)'],
        ]],
        ['Pickers  (:Seeky <name>, or the keys)', [
          ['files  ␣sf  C-S-A-O', 'find files'],
          ['grep  ␣sg  C-S-A-I', 'live grep'],
          ['grep word  ␣sw  C-S-A-G', 'grep the word under the cursor'],
          ['lines  ␣s/  C-S-A-L', 'search the current file'],
          ['symbols  ␣ss  C-S-A-,', 'workspace symbols'],
          ['outline  ␣so  C-S-A-B', 'document outline'],
          ['git  ␣sm  C-S-A-M', 'git modified files'],
          ['mixed', 'files and folders'],
          ['resume  ␣sr  C-S-A-R', 'reopen the last picker as you left it'],
          ['buffers  ␣sb', 'open documents'],
          ['oldfiles  ␣s.', 'recent files, any folder'],
          ["marks  ␣s'", 'marks; Enter jumps'],
          ['registers  ␣s"', 'registers; Enter pastes'],
          ['diagnostics  ␣sd', 'the Error List'],
          ['keymaps  ␣sk', 'your mappings; Enter runs one'],
          ['command_history  ␣s:', 'past commands; Enter runs one'],
          ['search_history  ␣s?', 'past searches; Enter searches'],
        ]],
      ];
      var HELP_NOTE = '␣ is <leader>; those keys are only set where your config leaves them free. C-S-A is Ctrl+Shift+Alt and works in insert mode too.';

      var helpEl = document.getElementById('help');

      function buildHelp() {
        HELP.forEach(function (section) {
          var block = document.createElement('section');
          var heading = document.createElement('h3');
          heading.textContent = section[0];
          block.appendChild(heading);
          section[1].forEach(function (entry) {
            var row = document.createElement('div');
            row.className = 'key-row';
            var keys = document.createElement('span');
            keys.className = 'keys';
            keys.textContent = entry[0];
            var what = document.createElement('span');
            what.className = 'what';
            what.textContent = entry[1];
            row.appendChild(keys);
            row.appendChild(what);
            block.appendChild(row);
          });
          helpEl.appendChild(block);
        });
        var note = document.createElement('div');
        note.className = 'note';
        note.textContent = HELP_NOTE;
        helpEl.appendChild(note);
      }

      function helpOpen() {
        return helpEl.classList.contains('open');
      }

      function toggleHelp(open) {
        helpEl.classList.toggle('open', open);
        helpEl.scrollTop = 0;
      }

      var mode = 'files'; // 'files' | 'grep' | 'buffer' | 'git' | 'mixed' | 'symbols' | 'path'
      var grepMode = 'fuzzy'; // 'plain' | 'regex' | 'fuzzy' | 'any' (fuzzy is fff's signature mode)
      var defsOnly = false;   // Ctrl+D: grep rows filtered to definitions (resets per search)
      var history = [];       // past queries from fff (most recent first)
      var historyIndex = -1;  // -1 = not navigating history
      var items = [];
      var rowByIndex = []; // item index -> DOM row (group headers shift positions)
      var selected = -1;
      var debounceTimer = null;
      var lastCapped = false;
      var lastDuration = 0;
      var DEFAULT_FONT_SIZE = 13;   // must match the stylesheet and the host's DefaultFontSize
      var fontSize = DEFAULT_FONT_SIZE;
      // Must match the stylesheet's [data-theme] blocks and SeekyState's list; first = default.
      var THEMES = [
        'phosphor', 'dark', 'light', 'tokyo-night', 'cyberpunk',
        'catppuccin-latte', 'catppuccin-frappe', 'catppuccin-macchiato', 'catppuccin-mocha',
        'nvim',
      ];
      var theme = THEMES[0];

      // VSNeo: the colorscheme's colors for the 'nvim' theme, keyed by CSS variable name
      // without the dashes; null until the host has them (no nvim, or not up yet).
      var palette = null;
      var PALETTE_VARS = ['bg', 'bg-alt', 'bg-sel', 'border', 'fg', 'fg-dim', 'accent', 'hot',
        'amber', 'green', 'hl', 'mhl-fg', 'mhl-bg'];

      // VSNeo, vim.g.vsneo_seeky_prompt_normal: Escape leaves the prompt for a normal mode
      // (j/k, gg/G, i/a back) and a second Escape closes. Off: one Escape closes.
      var promptNormal = false;
      var inNormal = false;
      var pendingG = false;
      var promptEl = document.getElementById('prompt');

      function applyTheme(name) {
        theme = THEMES.indexOf(name) >= 0 && (name !== 'nvim' || palette) ? name : THEMES[0];
        document.documentElement.setAttribute('data-theme', theme);
        applyPalette();
      }

      // Inline variables beat every stylesheet block, so they are set only for 'nvim' and
      // removed for any other theme.
      function applyPalette() {
        var style = document.documentElement.style;
        PALETTE_VARS.forEach(function (name) {
          var value = theme === 'nvim' && palette ? palette[name] : null;
          if (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value)) {
            style.setProperty('--' + name, value);
          } else {
            style.removeProperty('--' + name);
          }
        });
      }

      // Ctrl+T: next theme, live, reported like the other state so the host saves it on close.
      // 'nvim' is skipped while there is no palette to show.
      function cycleTheme() {
        var next = (THEMES.indexOf(theme) + 1) % THEMES.length;
        if (THEMES[next] === 'nvim' && !palette) {
          next = (next + 1) % THEMES.length;
        }
        applyTheme(THEMES[next]);
        sendState();
        statusEl.textContent = 'theme ' + theme + ' — Ctrl+T cycles; saved on close';
      }

      // Ctrl+Plus/Minus/0 are implemented here rather than left to the browser: the host turns
      // Chromium's accelerator keys off so Ctrl+P/N can reach the picker, which takes the
      // built-in zoom shortcuts with them. Ctrl+wheel zoom is still the browser's.
      function clampFontSize(size) {
        return Math.max(8, Math.min(32, Math.round(size)));
      }

      function applyFontSize() {
        document.body.style.fontSize = fontSize + 'px';
      }

      // Report what the user changed so the host can persist it. The host keeps this in memory
      // and writes it once, on close — sending per keystroke is fine, autorepeat included.
      function sendState() {
        send({ type: 'stateChanged', fontSize: fontSize, grepMode: grepMode, defsOnly: defsOnly, theme: theme });
      }

      function adjustFontSize(delta) {
        var next = clampFontSize(fontSize + delta);
        if (next === fontSize) {
          return;
        }
        fontSize = next;
        applyFontSize();
        sendState();
        statusEl.textContent = 'font size ' + fontSize + 'px — Ctrl+0 resets; saved per solution on close';
        // Keep the selected row in view: changing size reflows every row's height.
        var row = rowByIndex[selected];
        if (row) {
          row.scrollIntoView({ block: 'nearest' });
        }
      }

      // VSNeo's list pickers, fed by Visual Studio and nvim (Telescope's names). Host-entered
      // only, like 'path'; Tab out of one goes to Find Files.
      var LIST_MODES = {
        buffers: 'Buffers',
        oldfiles: 'Recent Files',
        marks: 'Marks',
        registers: 'Registers',
        diagnostics: 'Diagnostics',
        keymaps: 'Keymaps',
        command_history: 'Command History',
        search_history: 'Search History',
      };

      function isListMode() {
        return LIST_MODES.hasOwnProperty(mode);
      }

      function send(message) {
        if (bridge) {
          bridge.postMessage(message);
        }
      }

      // ---------------------------------------------------------------- search

      function sendSearch() {
        var query = queryEl.value;
        // Symbols, Symbol Path and Find Files (recent files) are browsable lists: an empty query
        // lists rather than clearing, so the picker is useful before the first keystroke.
        if (query.length === 0 && mode !== 'symbols' && mode !== 'path' && mode !== 'files' && !isListMode()) {
          // Clean state: no query, no search, no results.
          items = [];
          selected = -1;
          renderResults();
          previewTitleEl.textContent = '';
          previewContentEl.textContent = '';
          statusEl.textContent = HINT;
          return;
        }
        send({ type: 'search', query: query, mode: mode, grepMode: grepMode });
      }

      // Current File is Live Grep scoped to one document: same rows, sub-modes and defs filter.
      function isGrepLike() {
        return mode === 'grep' || mode === 'buffer';
      }

      function scheduleSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(sendSearch, 150);
      }

      function updatePromptLabel() {
        if (isListMode()) {
          modeLabelEl.textContent = LIST_MODES[mode];
          return;
        }
        modeLabelEl.textContent = mode === 'files'
          ? 'Find Files'
          : mode === 'git'
            ? 'Git Modified'
            : mode === 'mixed'
                ? 'Files & Folders'
                : mode === 'symbols'
                    ? 'Symbols'
                    : mode === 'path'
                        ? 'Document Outline'
                        : mode === 'buffer'
                            ? `Current File (${grepMode})`
                            : `Live Grep (${grepMode})`;
      }

      function toggleMode() {
        // files/grep/buffer/symbols/git/mixed. 'path' is command-entered only (the caret
        // context exists only when the command runs); Tab out of it falls through to 'files'.
        mode = mode === 'files' ? 'grep'
          : mode === 'grep' ? 'buffer'
            : mode === 'buffer' ? 'symbols'
              : mode === 'symbols' ? 'git'
                : mode === 'git' ? 'mixed' : 'files';
        updatePromptLabel();
        sendSearch();
      }

      // Host-driven mode set (Seeky: Find Files / Live Grep commands). Unlike toggleMode,
      // this never fires a search and never touches the query: the host sends 'reset' on
      // every show, so the page is already in a clean state, and if 'setMode' races ahead
      // of 'reset' it must not clobber an in-flight typed query.
      function applyMode(newMode) {
        if (newMode !== 'files' && newMode !== 'grep' && newMode !== 'buffer' && newMode !== 'git' && newMode !== 'mixed' && newMode !== 'symbols' && newMode !== 'path' && !LIST_MODES.hasOwnProperty(newMode)) {
          return;
        }
        mode = newMode;
        updatePromptLabel();
        if (mode === 'symbols' || mode === 'path' || mode === 'files' || isListMode()) {
          // These list on an empty query — kick off as soon as the popup opens.
          sendSearch();
        }
      }

      function toggleGrepMode() {
        if (!isGrepLike()) {
          return; // grep sub-modes only make sense in Live Grep / Current File
        }
        grepMode = grepMode === 'plain' ? 'regex'
          : grepMode === 'regex' ? 'fuzzy'
            : grepMode === 'fuzzy' ? 'any' : 'plain';
        updatePromptLabel();
        sendState();
        sendSearch();
      }

      // Ctrl+D: filter grep rows to definitions only (page-side). Sticky — it survives both a new
      // search and a popup close, so a grep session stays filtered once you ask for it.
      function toggleDefsOnly() {
        if (!isGrepLike()) {
          return;
        }
        defsOnly = !defsOnly;
        var keep = isVisible(selected);
        if (!keep) {
          selected = nearestVisible(0, 1);
        }
        renderResults();
        updateResultStatus();
        sendState();
        if (!keep) {
          showSelectedPreview();
        }
      }

      // Ctrl+F on a file-list row: switch to Live Grep scoped to it — 'folder/ ' for a folder,
      // '**/path ' for a file (fff v0.10.1 ignores a bare file path as a grep constraint but
      // honours it as a glob). The caret lands after the scope; nothing is searched until a
      // pattern is typed (a scope alone matches no lines anyway).
      function grepInSelected() {
        var item = items[selected];
        if (!item || (mode !== 'files' && mode !== 'mixed' && mode !== 'git')) {
          return;
        }
        var scope = item.isDirectory ? item.path + '/' : '**/' + item.path;
        mode = 'grep';
        updatePromptLabel();
        queryEl.value = scope + ' ';
        queryEl.setSelectionRange(queryEl.value.length, queryEl.value.length);
        historyIndex = -1;
        items = [];
        selected = -1;
        renderResults();
        previewTitleEl.textContent = '';
        previewContentEl.textContent = '';
        statusEl.textContent = 'grep in ' + item.path + (item.isDirectory ? '/' : '') + ' — type a pattern';
      }

      // Indices into items[] visible under the current defsOnly filter.
      function visibleIndices() {
        var out = [];
        for (var i = 0; i < items.length; i++) {
          if (!defsOnly || !isGrepLike() || items[i].isDefinition) {
            out.push(i);
          }
        }
        return out;
      }

      // The selection only ever rests on a visible row: with defs only on, items[0] can be a
      // hidden non-definition, and selecting it left no row lit while the preview and Enter
      // went to a line the list did not show.
      function isVisible(index) {
        return index >= 0 && index < items.length &&
          (!defsOnly || !isGrepLike() || items[index].isDefinition === true);
      }

      // The first visible index from `from` stepping by `step` (+1 or -1), or -1 when none.
      function nearestVisible(from, step) {
        for (var i = from; i >= 0 && i < items.length; i += step) {
          if (isVisible(i)) {
            return i;
          }
        }
        return -1;
      }

      // One row toward `step`, staying put at either end of the visible rows.
      function stepSelection(step) {
        var next = nearestVisible(selected + step, step);
        select(next >= 0 ? next : selected);
      }

      function showSelectedPreview() {
        if (selected >= 0) {
          requestPreview(items[selected]);
        } else {
          previewTitleEl.textContent = '';
          previewContentEl.textContent = '';
        }
      }

      function updateResultStatus() {
        var count = visibleIndices().length;
        statusEl.textContent = count + ' results' +
          (lastCapped ? ' (capped)' : '') +
          (defsOnly && isGrepLike() ? ' (defs only)' : '') +
          (mode === 'files' && queryEl.value === '' ? ' (recent files)' : '') +
          ' — ' + lastDuration + 'ms';
      }

      // ---------------------------------------------------------------- rendering
      // Everything below builds DOM with textContent only — workspace content is untrusted.

      // Appends `text` to `parent`, wrapping each [start,end) char-index range in a .mhl
      // highlight span. Ranges are clamped and overlaps skipped defensively.
      function appendHighlightedSegments(parent, text, ranges) {
        if (!ranges || ranges.length === 0 || text.length === 0) {
          parent.appendChild(document.createTextNode(text));
          return;
        }
        var sorted = ranges.slice().sort(function (a, b) { return a[0] - b[0]; });
        var cursor = 0;
        sorted.forEach(function (range) {
          var s = Math.max(0, Math.min(range[0], text.length));
          var e = Math.max(0, Math.min(range[1], text.length));
          if (s < cursor) { s = cursor; }
          if (e <= s) { return; }
          if (s > cursor) {
            parent.appendChild(document.createTextNode(text.slice(cursor, s)));
          }
          var span = document.createElement('span');
          span.className = 'mhl';
          span.textContent = text.slice(s, e);
          parent.appendChild(span);
          cursor = e;
        });
        if (cursor < text.length) {
          parent.appendChild(document.createTextNode(text.slice(cursor)));
        }
      }

      // Small git-status badge for result rows (amber M = modified, green ?? = untracked,
      // dim everything else). Full status goes on the title. Returns null when clean.
      function gitBadge(status) {
        if (!status) {
          return null;
        }
        var normalized = String(status).trim().toLowerCase();
        // fff reports clean/tracked files too (rendered as 'cl') — only badge real changes.
        if (normalized === '' || normalized === 'cl' || normalized === 'clean') {
          return null;
        }
        var cls = 'dim';
        var text = status.length <= 3 ? status : status.slice(0, 2);
        if (normalized.indexOf('untrack') >= 0 || normalized === '??') { cls = 'ut'; text = '??'; }
        else if (normalized.indexOf('mod') >= 0) { cls = 'm'; text = 'M'; }
        else if (normalized.indexOf('add') >= 0) { cls = 'ut'; text = 'A'; }
        else if (normalized.indexOf('del') >= 0) { cls = 'm'; text = 'D'; }
        else if (normalized.indexOf('ren') >= 0) { cls = 'dim'; text = 'R'; }
        var badge = document.createElement('span');
        badge.className = `git-badge ${cls}`;
        badge.textContent = text;
        badge.title = status;
        return badge;
      }

      function renderResults() {
        resultsEl.textContent = '';
        rowByIndex = [];
        // Emit worst-first so the best match (index 0) is the bottom row, next to the prompt.
        // In grep mode, group matches under a header row per file.
        var indices = visibleIndices();
        var lastGroupPath = null;
        for (var n = indices.length - 1; n >= 0; n--) {
          var index = indices[n];
          var item = items[index];
          if (isGrepLike() && item.path !== lastGroupPath) {
            lastGroupPath = item.path;
            var header = document.createElement('div');
            header.className = 'group-header';
            header.setAttribute('data-path', item.path);
            header.textContent = item.path;
            resultsEl.appendChild(header);
          }
          var row = document.createElement('div');
          row.className = 'row' + (isGrepLike() ? ' match' : '') + (index === selected ? ' selected' : '');
          row.setAttribute('data-index', String(index));
          var badge = gitBadge(item.gitStatus);
          // Symbols rows lead with the fixed-width [kind] column, so a leading git badge would
          // make that column ragged — it goes after the location instead.
          if (badge && mode !== 'symbols') {
            row.appendChild(badge);
          }
          if (isListMode()) {
            // "[kind]  name  detail": the name carries the match highlight.
            var listKind = document.createElement('span');
            listKind.className = 'kind-badge';
            listKind.textContent = item.kind || '';
            row.appendChild(listKind);
            var listName = document.createElement('span');
            appendHighlightedSegments(listName, item.name || '', item.nameRanges);
            row.appendChild(listName);
            if (item.detail) {
              var listDetail = document.createElement('span');
              listDetail.className = 'sym-location';
              listDetail.textContent = item.detail;
              row.appendChild(listDetail);
            }
          } else if (mode === 'path') {
            // Document outline: "kind  Name  :line", indented by declaration depth (em so
            // Ctrl+± font scaling keeps proportions). All rows are the same file — the path
            // goes on the tooltip.
            row.style.paddingLeft = ((item.depth || 0) / 4 * 1.5) + 'em';
            var pathKind = document.createElement('span');
            pathKind.className = 'kind-badge';
            pathKind.textContent = item.kind || '';
            row.appendChild(pathKind);
            var pathName = document.createElement('span');
            pathName.textContent = item.name || '';
            row.appendChild(pathName);
            var pathLoc = document.createElement('span');
            pathLoc.className = 'sym-location';
            pathLoc.textContent = ':' + item.line;
            pathLoc.title = item.path || '';
            row.appendChild(pathLoc);
          } else if (mode === 'symbols') {
            // "kind  Name  path:line" — the name carries the fuzzy highlight, not the source line.
            var kindBadge = document.createElement('span');
            kindBadge.className = 'kind-badge';
            kindBadge.textContent = item.kind || '';
            row.appendChild(kindBadge);
            var symName = document.createElement('span');
            appendHighlightedSegments(symName, item.name || '', item.nameRanges);
            row.appendChild(symName);
            var symLoc = document.createElement('span');
            symLoc.className = 'sym-location';
            symLoc.textContent = item.path + ':' + item.line;
            symLoc.title = item.text || '';
            row.appendChild(symLoc);
            if (badge) {
              badge.style.marginLeft = '6px';
              badge.style.marginRight = '0';
              row.appendChild(badge);
            }
          } else if (isGrepLike()) {
            if (item.isDefinition) {
              var defBadge = document.createElement('span');
              defBadge.className = 'def-badge';
              defBadge.textContent = 'def';
              row.appendChild(defBadge);
            }
            var loc = document.createElement('span');
            loc.className = 'dim';
            loc.textContent = item.line + ': ';
            row.appendChild(loc);
            var text = document.createElement('span');
            appendHighlightedSegments(text, item.text || '', item.ranges);
            row.appendChild(text);
          } else {
            // Directory rows render with a trailing slash for distinction.
            row.appendChild(document.createTextNode(item.isDirectory ? item.path + '/' : item.path));
            if ((mode === 'files' || mode === 'mixed') && item.line) {
              // Query ended in ':line[:col]' — show where Enter will land.
              var fileLoc = document.createElement('span');
              fileLoc.className = 'dim';
              fileLoc.textContent = ':' + item.line + (item.col ? ':' + item.col : '');
              row.appendChild(fileLoc);
            }
          }
          rowByIndex[index] = row;
          resultsEl.appendChild(row);
        }
      }

      function renderPreview(message) {
        previewTitleEl.textContent = message.path || '';
        previewContentEl.textContent = '';
        // Binary files are never read — the host posts { binary: true } instead of content.
        if (message.binary) {
          previewContentEl.textContent = 'binary file — no preview';
          return;
        }
        var matchLine = message.line || 0;
        var hl = null;
        (message.content || '').split('\n').forEach(function (lineText, index) {
          var line = document.createElement('span');
          line.className = 'line';
          if (index + 1 === matchLine) {
            line.className = `${line.className} hl`;
            hl = line;
            // Span-level highlight of the match ranges within the match line (line modes only).
            var sel = items[selected];
            if (isGrepLike() && sel && sel.ranges && sel.ranges.length > 0) {
              appendHighlightedSegments(line, lineText, sel.ranges);
              previewContentEl.appendChild(line);
              return;
            }
          }
          line.textContent = lineText;
          previewContentEl.appendChild(line);
        });
        if (hl) {
          hl.scrollIntoView({ block: 'center' });
        }
      }

      // Sends a preview request for an item — except binary files, which render a neutral
      // note locally (the host also guards against reading them).
      function requestPreview(item) {
        if (!item) {
          return;
        }
        if (item.isBinary) {
          previewTitleEl.textContent = item.path || '';
          previewContentEl.textContent = 'binary file — no preview';
          return;
        }
        if (!item.path) {
          // VSNeo list rows with nothing on disk (a register, a mapping): the row's own text.
          previewTitleEl.textContent = item.name || '';
          previewContentEl.textContent = typeof item.preview === 'string' ? item.preview : (item.detail || '');
          return;
        }
        send({ type: 'preview', path: item.path, line: item.line, binary: item.isBinary === true, directory: item.isDirectory === true });
      }

      function select(index) {
        if (index < 0 || index >= items.length) {
          return;
        }

        var previous = selected;
        selected = index;

        if (previous !== selected) {
          var previousRow = rowByIndex[previous];
          if (previousRow) {
            previousRow.classList.remove('selected');
          }
          var selectedRow = rowByIndex[selected];
          if (selectedRow) {
            selectedRow.classList.add('selected');
          }
        }

        var row = rowByIndex[selected];
        if (!row) {
          renderResults();
          row = rowByIndex[selected];
        }

        if (row) {
          row.scrollIntoView({ block: 'nearest' });
        }
        requestPreview(items[index]);
      }

      // split (VSNeo): undefined, 'vertical' (Ctrl+V) or 'horizontal' (Ctrl+X), Telescope's
      // open variants. A folder ignores it - it opens in Explorer either way.
      function openSelected(split) {
        var item = items[selected];
        if (item && item.pick) {
          send({ type: 'pick', mode: mode, name: item.name });
          return;
        }
        if (item) {
          // col only from Find Files / Files & Folders (the ':line:col' query suffix) and the
          // Error List (1-based already). Grep rows carry fff's 0-based byte column, which is not
          // the 1-based char column the host expects.
          var fromQuery = mode === 'files' || mode === 'mixed' || mode === 'diagnostics';
          send({ type: 'open', path: item.path, line: item.line, col: fromQuery ? item.col : undefined, directory: item.isDirectory === true, split: split });
        }
      }

      // Ctrl+Q (VSNeo): the visible rows, best first, into nvim's quickfix list. The host
      // fills in columns (it knows where each row lands) and closes the picker.
      function sendQuickfix() {
        var rows = [];
        visibleIndices().forEach(function (i) {
          var item = items[i];
          if (!item.isDirectory && item.path) {
            rows.push({ path: item.path, line: item.line || 1, text: item.text || item.name || item.path });
          }
        });
        if (rows.length === 0) {
          statusEl.textContent = 'nothing to send to quickfix';
          return;
        }
        send({ type: 'quickfix', title: modeLabelEl.textContent + ' > ' + queryEl.value, items: rows });
      }

      // ---------------------------------------------------------------- prompt normal mode

      function setNormal(on) {
        inNormal = on;
        pendingG = false;
        promptEl.classList.toggle('normal', on);
        queryEl.readOnly = on;
        statusEl.textContent = on
          ? 'NORMAL — j/k move · gg/G ends · Enter opens · i/a back to the prompt · ? help · Esc closes'
          : HINT;
      }

      // Plain keys in prompt normal mode. True when the key was consumed. Ctrl chords, arrows,
      // Tab and Enter fall through to the prompt's own handling.
      function onNormalKeyDown(e) {
        if (e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) {
          return false;
        }
        var key = e.key;
        var wasG = pendingG;
        pendingG = false;
        var target = -1;
        if (key === 'j') {
          stepSelection(-1); // down toward the prompt = lower index
        } else if (key === 'k') {
          stepSelection(1);
        } else if (key === 'g') {
          if (wasG) {
            target = nearestVisible(items.length - 1, -1); // the top row
          } else {
            pendingG = true;
          }
        } else if (key === 'G') {
          target = nearestVisible(0, 1); // the bottom row, next to the prompt
        } else if (key === 'i' || key === 'I' || key === 'a' || key === 'A') {
          setNormal(false);
          var at = key === 'I' ? 0 : queryEl.value.length;
          queryEl.setSelectionRange(at, at);
        }
        if (target >= 0) {
          select(target);
        }
        return true; // every other printable key is swallowed, as in Vim's normal mode
      }

      // Keep keyboard focus in the prompt when a row is clicked: rows are plain divs, so a click
      // would otherwise hand focus to <body>, where Enter, arrows and typing do nothing (only
      // Esc still works — the host catches that one as an accelerator).
      resultsEl.addEventListener('mousedown', function (e) {
        e.preventDefault();
      });

      resultsEl.addEventListener('click', function (e) {
        var target = e.target;
        if (!(target instanceof Element)) {
          return;
        }

        var row = target.closest('.row');
        if (!row || !resultsEl.contains(row)) {
          return;
        }

        var index = Number(row.getAttribute('data-index'));
        if (Number.isInteger(index)) {
          select(index);
        }
      });

      resultsEl.addEventListener('dblclick', function (e) {
        var target = e.target;
        if (!(target instanceof Element)) {
          return;
        }

        var header = target.closest('.group-header');
        if (header && resultsEl.contains(header)) {
          var path = header.getAttribute('data-path');
          if (path) {
            send({ type: 'open', path: path });
          }
          return;
        }

        var row = target.closest('.row');
        if (!row || !resultsEl.contains(row)) {
          return;
        }

        var index = Number(row.getAttribute('data-index'));
        if (Number.isInteger(index)) {
          select(index);
          openSelected();
        }
      });

      // ---------------------------------------------------------------- input

      queryEl.addEventListener('input', function () {
        historyIndex = -1; // typing abandons history navigation
        scheduleSearch();
      });

      function onPromptKeyDown(e) {
        var key = e.key;
        if (key === 'Tab' || (key === 'g' && e.ctrlKey)) {
          e.preventDefault();
          toggleMode();
        } else if (key === 'r' && e.ctrlKey) {
          e.preventDefault();
          toggleGrepMode();
        } else if (e.ctrlKey && e.shiftKey && (key === '+' || key === '=')) {
          // Window size lives on the host (it owns the HWND and the screen metrics), so these
          // only send the intent. They MUST be tested before the plain-Ctrl font branches below:
          // with Shift held, '=' arrives as '+', which those would otherwise swallow.
          e.preventDefault();
          send({ type: 'resizeWindow', step: 1 });
        } else if (e.ctrlKey && e.shiftKey && (key === '-' || key === '_')) {
          e.preventDefault();
          send({ type: 'resizeWindow', step: -1 });
        } else if (e.ctrlKey && e.shiftKey && (key === '0' || key === ')' || e.code === 'Digit0')) {
          // Shift+0 is ')' on a US layout and varies elsewhere — e.code is the reliable test.
          e.preventDefault();
          send({ type: 'resizeWindow', step: 0 });
        } else if (e.ctrlKey && (key === '+' || key === '=')) {
          // '=' is the unshifted key on most layouts; accept both so Ctrl+= works without Shift.
          e.preventDefault();
          adjustFontSize(1);
        } else if (e.ctrlKey && (key === '-' || key === '_')) {
          e.preventDefault();
          adjustFontSize(-1);
        } else if (e.ctrlKey && key === '0') {
          e.preventDefault();
          fontSize = DEFAULT_FONT_SIZE;
          applyFontSize();
          sendState();
          updateResultStatus();
        } else if (key === 'd' && e.ctrlKey) {
          e.preventDefault();
          toggleDefsOnly();
        } else if (key === 't' && e.ctrlKey) {
          e.preventDefault();
          cycleTheme();
        } else if (key === 'f' && e.ctrlKey) {
          e.preventDefault();
          grepInSelected();
        } else if (key === 'v' && e.ctrlKey) {
          // Telescope's Ctrl+V. It takes the paste chord; Shift+Insert still pastes.
          e.preventDefault();
          openSelected('vertical');
        } else if (key === 'x' && e.ctrlKey) {
          e.preventDefault();
          openSelected('horizontal');
        } else if (key === 'q' && e.ctrlKey) {
          e.preventDefault();
          sendQuickfix();
        } else if (key === 'ArrowDown' || (key === 'j' && e.ctrlKey) || (key === 'n' && e.ctrlKey)) {
          e.preventDefault();
          if (historyIndex >= 0) {
            // History nav: move newer; past the newest entry clears the input.
            historyIndex--;
            queryEl.value = historyIndex >= 0 ? history[historyIndex] : '';
            sendSearch();
          } else if (queryEl.value === '' && items.length === 0 && history.length > 0) {
            return; // empty prompt with nothing listed: no selection to move
          } else {
            // column-reverse: visually down = lower index (toward the prompt)
            stepSelection(-1);
          }
        } else if (key === 'ArrowUp' || (key === 'k' && e.ctrlKey) || (key === 'p' && e.ctrlKey)) {
          e.preventDefault();
          // Symbols lists on an empty query, so "empty prompt" alone no longer means "nothing
          // to navigate" — only fall through to history when the list is actually empty.
          if ((queryEl.value === '' && items.length === 0) || historyIndex >= 0) {
            // Empty prompt (or already navigating): cycle past queries, telescope-style.
            if (history.length > 0 && historyIndex < history.length - 1) {
              historyIndex++;
              queryEl.value = history[historyIndex];
              sendSearch();
            }
          } else {
            stepSelection(1);
          }
        } else if (key === 'Enter') {
          e.preventDefault();
          openSelected();
        }
      }
      queryEl.addEventListener('keydown', onPromptKeyDown);

      // Whenever the page gains focus (the host activating the window, Alt+Tab back), the
      // caret goes to the prompt rather than to whatever was focused last.
      window.addEventListener('focus', function () {
        queryEl.focus();
      });

      // Capture phase, so it runs wherever focus sits: Escape always closes, and a key typed
      // with focus elsewhere (the preview pane after a text selection) is sent to the prompt -
      // moving focus during keydown redirects the character that follows.
      document.addEventListener('keydown', function (e) {
        if ((e.key === '/' && e.ctrlKey) || (inNormal && e.key === '?' && !e.ctrlKey)) {
          e.preventDefault();
          e.stopPropagation();
          toggleHelp(!helpOpen());
          return;
        }
        if (helpOpen()) {
          // Help is a glance: Escape closes it (not the picker), and any other key closes it
          // and then does what it would have done.
          toggleHelp(false);
          if (e.key === 'Escape') {
            e.preventDefault();
            return;
          }
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          if (promptNormal && !inNormal) {
            setNormal(true);
          } else {
            send({ type: 'close' });
          }
          return;
        }
        if (inNormal && onNormalKeyDown(e)) {
          e.preventDefault();
          e.stopPropagation();
          queryEl.focus();
          return;
        }
        if (document.activeElement === queryEl) {
          return;
        }
        // The prompt's own keys (arrows, PageUp/PageDown, Enter, the Ctrl chords) act on the
        // results wherever focus sits. Refocusing alone was not enough for them: the event was
        // already dispatched past the prompt, and the arrows scrolled the preview pane last
        // clicked or scrolled instead of moving the selection.
        onPromptKeyDown(e);
        if (e.defaultPrevented) {
          e.stopPropagation();
          queryEl.focus();
          return;
        }
        if (!e.ctrlKey && !e.altKey && !e.metaKey) {
          queryEl.focus();
        }
      }, true);

      buildHelp();

      // ---------------------------------------------------------------- host messages

      if (bridge) {
        bridge.addEventListener('message', function (e) {
          var message = e.data;
          if (!message) {
            return;
          }
          if (message.type === 'results') {
            items = message.items || [];
            lastCapped = !!message.capped;
            lastDuration = message.duration || 0;
            // The host can preselect a row (document outline: the symbol enclosing the caret).
            var hostPick = typeof message.selectedIndex === 'number'
              ? Math.min(message.selectedIndex, items.length - 1)
              : -1;
            selected = items.length > 0 ? (hostPick >= 0 ? hostPick : 0) : -1;
            if (!isVisible(selected)) {
              selected = nearestVisible(0, 1);
            }
            renderResults();
            if (hostPick >= 0) {
              var pickedRow = rowByIndex[selected];
              if (pickedRow) {
                pickedRow.scrollIntoView({ block: 'center' });
              }
            } else {
              // Best match is the bottom row — scroll to it.
              resultsEl.scrollTop = resultsEl.scrollHeight;
            }
            updateResultStatus();
            showSelectedPreview();
          } else if (message.type === 'preview') {
            renderPreview(message);
          } else if (message.type === 'status') {
            statusEl.textContent = message.message || '';
          } else if (message.type === 'reset') {
            // The window is reused between popups — start clean, search only on typing.
            toggleHelp(false);
            setNormal(false);
            queryEl.value = '';
            items = [];
            defsOnly = false;
            historyIndex = -1;
            selected = -1;
            renderResults();
            previewTitleEl.textContent = '';
            previewContentEl.textContent = '';
            statusEl.textContent = HINT;
            queryEl.focus();
          } else if (message.type === 'setMode') {
            applyMode(message.mode);
          } else if (message.type === 'history') {
            // Past queries (fff track_query history); ↑ in an empty prompt cycles them.
            history = message.queries || [];
            historyIndex = -1;
          } else if (message.type === 'setState') {
            // Restored on every show, and again if the workspace resolves to a different solution
            // than the one the popup opened against.
            if (typeof message.fontFamily === 'string' && message.fontFamily.length > 0) {
              document.body.style.fontFamily = message.fontFamily;
            }
            if (typeof message.fontSize === 'number' && message.fontSize > 0) {
              fontSize = clampFontSize(message.fontSize);
              applyFontSize();
            }
            if (message.grepMode === 'plain' || message.grepMode === 'regex' || message.grepMode === 'fuzzy' || message.grepMode === 'any') {
              grepMode = message.grepMode;
            }
            defsOnly = !!message.defsOnly;
            if ('palette' in message) {
              palette = message.palette && typeof message.palette === 'object' ? message.palette : null;
            }
            if (typeof message.promptNormal === 'boolean') {
              promptNormal = message.promptNormal;
            }
            if (typeof message.theme === 'string') {
              applyTheme(message.theme);
            }
            // The prompt label carries the grep sub-mode, so it has to be redrawn here — 'setMode'
            // follows this message and would otherwise be the only thing that refreshes it.
            updatePromptLabel();
          } else if (message.type === 'setQuery') {
            queryEl.value = message.query || '';
            // Selected, not just filled: the term came from the editor, so the first keystroke
            // should replace it rather than append to it.
            queryEl.focus();
            queryEl.select();
            sendSearch();
          }
        });
      }

      if (!bridge) {
        statusEl.textContent = 'WebView2 host bridge NOT available';
      } else {
        statusEl.textContent = HINT;
        // No initial search — the window opens clean and searches only once the user types
        // (except Symbols, which lists on an empty query; see applyMode).
      }
    })();
  </script>
</body>
</html>
