name: Feature request
description: Suggest a capability or a workflow improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow, not only the key you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like VSNeo to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: VsVim, a plugin under ~/.vsneo/pack, a mapping, a Visual Studio command...
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I checked docs/options.md and the existing issues.
          required: true
