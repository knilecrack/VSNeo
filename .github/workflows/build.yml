# CI build for the VSIX. Every push to master publishes a CI build to the
# Open VSIX Gallery; pushing a v* tag attaches the VSIX to a GitHub Release
# and updates the Visual Studio Marketplace listing. The test job runs the
# companion Lua suites (tests/) against a real headless Neovim first, and
# build - and with it every publish step - waits for green tests.
#
# Marketplace auth is Entra OIDC, no PAT (global PATs are decommissioned
# 2026-12-01): the publish job runs in the "release" environment, which the
# app registration's federated credential matches (subject repo:
# knilecrack/VSNeo:environment:release). The service principal must be a
# member of the knilecrack marketplace publisher. AZURE_CLIENT_ID and
# AZURE_TENANT_ID are repo secrets; no client secret is stored anywhere.
name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  # Every PR, whatever it targets: a PR stacked on another feature branch
  # otherwise never builds (#7 went unbuilt until retargeted to master).
  # Publishing is unaffected - each publish step is gated on a push to
  # master or a tag, never on pull_request.
  pull_request:
  workflow_dispatch:

jobs:
  # The companion script's contracts, against real Neovim. C# behavior still
  # needs the VS + nvim stack and is validated by hand.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned download instead of choco: the community feed is a flaky
      # middleman (a 406 there killed the v1.4.1 release run before the tests
      # even started), and a fixed tag makes the nvim under test reproducible.
      # Bump deliberately.
      - name: Install Neovim
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\nvim-win64.zip"
          Invoke-WebRequest 'https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-win64.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath 'C:\nvim'

      - name: Run companion tests
        run: pwsh tests/run-tests.ps1 -NvimPath C:\nvim\nvim-win64\bin\nvim.exe

  # The extension's plain C# (msgpack codec, stream framer, byte/char column
  # mapping, the mirror's line-edit rules), compiled from the same source
  # files into a .NET 8 xunit project. None of it needs Visual Studio. It
  # runs on Windows, not Linux, for one test: NvimWireTests drives a real
  # nvim over the same named pipe the extension uses, and named pipes plus
  # nvim.exe are Windows-only - on ubuntu it returned early and counted as a
  # pass, so the only end-to-end wire test never ran in CI.
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          # 8 for the test project, 10 for seeky-engine (SeekyEngine/).
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Neovim
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\nvim-win64.zip"
          Invoke-WebRequest 'https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-win64.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath 'C:\nvim'
      # SeekyEngineClientTests drive the real engine; without this they
      # return early, as NvimWireTests does without nvim.
      - name: Publish seeky-engine
        run: dotnet publish SeekyEngine/SeekyEngine.csproj -c Release -r win-x64 -o "${{ runner.temp }}\seeky-engine"
      - name: Run C# unit tests
        env:
          VSNEO_NVIM_PATH: C:\nvim\nvim-win64\bin\nvim.exe
          SEEKY_ENGINE_PATH: ${{ runner.temp }}\seeky-engine\seeky-engine.exe
        run: dotnet test tests/dotnet/VSNeo.Tests --logger "console;verbosity=normal"

  build:
    needs: [ test, unit ]
    runs-on: windows-latest
    # contents: write for the GitHub Release step; the repo's default
    # GITHUB_TOKEN is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # The VSIX build publishes seeky-engine (a .NET 10 project) with the
      # dotnet CLI; see PublishSeekyEngine in VSNeo_Extension.csproj.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Local builds self-bump the third segment (BumpVersion.ps1, suppressed
      # in CI by the $(CI) check in the csproj), so CI takes its version from
      # the run - or from the tag, which is what a Release then carries.
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "1.1.${{ github.run_number }}"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Stamp version
        uses: madskristensen/vsix-version-stamp@v2
        with:
          manifest-file: VSNeo_Extension/source.extension.vsixmanifest
          version-number: ${{ steps.ver.outputs.version }}

      - name: Restore
        run: msbuild VSNeo_Extension\VSNeo_Extension.csproj /t:Restore

      - name: Build
        run: msbuild VSNeo_Extension\VSNeo_Extension.csproj /p:Configuration=Release

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: VSNeo_Extension.vsix
          path: VSNeo_Extension/bin/Release/net472/VSNeo_Extension.vsix

      # CI builds land in the Open VSIX Gallery. To ride them in Visual
      # Studio, add this feed under Tools > Options > Environment > Extensions:
      # https://www.vsixgallery.com/extension/VSNeo-ec21d06f-8395-403c-99b0-f2c417442403
      # The first upload prints a manage link in the run summary - save it,
      # it is the only way to delete the listing later.
      - name: Publish to Open VSIX Gallery
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: madskristensen/publish-vsixgallery@v1
        with:
          vsix-file: VSNeo_Extension/bin/Release/net472/VSNeo_Extension.vsix

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: VSNeo_Extension/bin/Release/net472/VSNeo_Extension.vsix

  # Marketplace publish is a separate job so the OIDC id-token permission and
  # the release environment (protection rules!) scope to releases only.
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: VSNeo_Extension.vsix

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # VS IDE extensions cannot go through the generic gallery REST endpoint
      # (VsIdeExtensionNotSupported) - VsixPublisher owns that protocol. Its
      # -personalAccessToken accepts an Entra token (verified locally), which
      # is what the Azure DevOps PublishVSExtension task has always done. The
      # token authorizes through the SP's membership of the publisher.
      - name: Acquire Entra token
        id: entra
        shell: pwsh
        run: |
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($token)) { throw 'could not acquire Entra token' }
          echo "::add-mask::$token"
          echo "token=$token" >> $env:GITHUB_OUTPUT

      - name: Publish to Visual Studio Marketplace
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: VSNeo_Extension.vsix
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ steps.entra.outputs.token }}
